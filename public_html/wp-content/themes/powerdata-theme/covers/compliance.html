<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Schibsted Grotesk';
    font-weight: 800;
    font-style: normal;
    src: url('../../assets/fonts/schibsted-grotesk-800.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Instrument Serif';
    font-weight: 400;
    font-style: italic;
    src: url('../../assets/fonts/instrument-serif-italic-400.woff2') format('woff2');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; }
  #cover.thumb .kicker-text,
  #cover.thumb .subhead { display: none; }
  #cover.thumb .motif { transform: scale(.72); transform-origin: top right; }
</style>
</head>
<body>

<div id="cover" style="width:1600px;height:900px;border-radius:0;overflow:hidden;
     background:#5A2A54;position:relative;box-sizing:border-box;
     font-family:'Hanken Grotesk',system-ui,sans-serif;">

  <div style="position:absolute;right:-190px;bottom:-240px;width:800px;height:800px;
       border-radius:50%;background:#47203F;"></div>
  <div style="position:absolute;left:-110px;top:-140px;width:400px;height:400px;
       border-radius:50%;background:#6E3768;"></div>

  <div style="position:absolute;inset:0;padding:72px 84px;display:flex;
       flex-direction:column;justify-content:space-between;">

    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <span class="kicker-text" style="font-size:22px;font-weight:600;letter-spacing:.18em;
            text-transform:uppercase;color:#C79FBC;">PowerData &middot; Field guide</span>
      <span class="motif"><svg width="160" height="148" viewBox="0 0 80 74" fill="none">
  <circle cx="40" cy="28" r="20" fill="none" stroke="#FAF8F4" stroke-width="3.5"/>
  <path d="M31 28 L38 35 L50 22" stroke="#FAF8F4" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M31 45 L26 68 L40 59 L54 68 L49 45" fill="#6E3768" stroke="#FAF8F4"
        stroke-width="2.6" stroke-linejoin="round"/>
</svg></span>
    </div>

    <div>
      <h1 style="margin:0;font-family:'Schibsted Grotesk',sans-serif;font-weight:800;
          font-size:150px;line-height:.98;letter-spacing:-.03em;color:#FAF8F4;">
        Compliance,<br>
        <span style="font-family:'Instrument Serif',Georgia,serif;font-weight:400;
              font-style:italic;letter-spacing:0;color:#E7C4DD;">handled.</span>
      </h1>
      <p class="subhead" style="margin:28px 0 0;font-size:34px;color:#C79FBC;max-width:36ch;">
        Meeting the mark — on paper and in practice.</p>
    </div>

  </div>
</div>

</body>
</html>
