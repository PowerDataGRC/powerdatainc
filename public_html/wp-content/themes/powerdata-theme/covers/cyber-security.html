<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Schibsted Grotesk';
    font-weight: 800;
    font-style: normal;
    src: url('../../assets/fonts/schibsted-grotesk-800.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Instrument Serif';
    font-weight: 400;
    font-style: italic;
    src: url('../../assets/fonts/instrument-serif-italic-400.woff2') format('woff2');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; }
  #cover.thumb .kicker-text,
  #cover.thumb .subhead { display: none; }
  #cover.thumb .motif { transform: scale(.72); transform-origin: top right; }
</style>
</head>
<body>

<div id="cover" style="width:1600px;height:900px;border-radius:0;overflow:hidden;
     background:#fe5a1d;position:relative;box-sizing:border-box;
     font-family:'Hanken Grotesk',system-ui,sans-serif;">

  <div style="position:absolute;right:-190px;bottom:-240px;width:800px;height:800px;
       border-radius:50%;background:#E8451A;"></div>
  <div style="position:absolute;left:-110px;top:-140px;width:400px;height:400px;
       border-radius:50%;background:#FF6E37;"></div>

  <div style="position:absolute;inset:0;padding:72px 84px;display:flex;
       flex-direction:column;justify-content:space-between;">

    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <span class="kicker-text" style="font-size:22px;font-weight:600;letter-spacing:.18em;
            text-transform:uppercase;color:#7A2E12;">PowerData &middot; Field guide</span>
      <span class="motif"><svg width="172" height="148" viewBox="0 0 86 74" fill="none">
  <path d="M62 6 L62 22 C62 33 49 33 49 23" stroke="#0F1B2D" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="62" cy="6" r="3.2" stroke="#0F1B2D" stroke-width="3"/>
  <rect x="10" y="32" width="58" height="38" rx="3" fill="#FAF8F4" stroke="#0F1B2D" stroke-width="3"/>
  <path d="M12 35 L39 55 L66 35" fill="none" stroke="#0F1B2D" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg></span>
    </div>

    <div>
      <h1 style="margin:0;font-family:'Schibsted Grotesk',sans-serif;font-weight:800;
          font-size:150px;line-height:.98;letter-spacing:-.03em;color:#0F1B2D;">
        Cyber,<br>
        <span style="font-family:'Instrument Serif',Georgia,serif;font-weight:400;
              font-style:italic;letter-spacing:0;color:#FAF8F4;">Awareness.</span>
      </h1>
      <p class="subhead" style="margin:28px 0 0;font-size:34px;color:#7A2E12;max-width:36ch;">
        Spotting the trick in the inbox before anyone clicks it.</p>
    </div>

  </div>
</div>

</body>
</html>
