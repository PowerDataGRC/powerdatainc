name: Deploy to Hostinger

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Configure SSH
      env:
        SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
        SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
      run: |
        mkdir -p ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

    - name: Ensure remote directories exist
      env:
        SSH_USER: ${{ secrets.HOSTINGER_USER }}
        SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
        SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
      run: |
        ssh -p $SSH_PORT -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
          "$SSH_USER@$SSH_HOST" \
          "mkdir -p ~/public_html/wp-content/themes/powerdata-theme ~/public_html/portal"

    - name: Sync theme
      env:
        SSH_USER: ${{ secrets.HOSTINGER_USER }}
        SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
        SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
      run: |
        rsync -avz --delete --checksum \
          -e "ssh -p $SSH_PORT -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
          public_html/wp-content/themes/powerdata-theme/ \
          "$SSH_USER@$SSH_HOST:~/public_html/wp-content/themes/powerdata-theme/"

    - name: Verify theme version on server
      env:
        SSH_USER: ${{ secrets.HOSTINGER_USER }}
        SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
        SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
      run: |
        ssh -p $SSH_PORT -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
          "$SSH_USER@$SSH_HOST" \
          "grep -m1 'POWERDATA_VERSION' ~/public_html/wp-content/themes/powerdata-theme/functions.php && grep -m1 '^Version:' ~/public_html/wp-content/themes/powerdata-theme/style.css"

    - name: Sync portal
      env:
        SSH_USER: ${{ secrets.HOSTINGER_USER }}
        SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
        SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
      run: |
        rsync -az --delete --checksum \
          -e "ssh -p $SSH_PORT -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
          public_html/portal/ \
          "$SSH_USER@$SSH_HOST:~/public_html/portal/"

    - name: Sync WordPress .htaccess
      env:
        SSH_USER: ${{ secrets.HOSTINGER_USER }}
        SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
        SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
      run: |
        rsync -az \
          -e "ssh -p $SSH_PORT -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
          public_html/.htaccess \
          "$SSH_USER@$SSH_HOST:~/public_html/.htaccess"
